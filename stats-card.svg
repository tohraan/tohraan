<svg xmlns="http://www.w3.org/2000/svg" width="330" height="200" viewBox="0 0 330 200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><style>.a{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.b{transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.t{fill:#e6edf3}.m{fill:#8b9bb0}.v{fill:#00e5a0;font-weight:700}</style>
